x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  evolution:
    image: evoapicloud/evolution-api:latest
    container_name: jarvis_evolution
    restart: unless-stopped
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
    env_file:
      - .env
    environment:
      SERVER_URL: http://localhost:8080
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@evolution-postgres:5432/${POSTGRES_DATABASE}?schema=public
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/6
      WEBHOOK_GLOBAL_ENABLED: "false"
      TELEMETRY_ENABLED: "false"
      LANGUAGE: es
    healthcheck:
      test:
        - CMD-SHELL
        - >
          node -e "require('http').get({host:'127.0.0.1',port:8080,
          path:'/instance/fetchInstances',headers:{apikey:process.env.AUTHENTICATION_API_KEY}},
          r=>process.exit(r.statusCode>=200&&r.statusCode<400?0:1)).on('error',()=>process.exit(1))"
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 45s
    logging: *default-logging
    networks:
      - jarvis-net

  evolution-postgres:
    image: postgres:15
    container_name: jarvis_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["postgres", "-c", "max_connections=1000"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME} -d ${POSTGRES_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - jarvis-net

  evolution-redis:
    image: redis:7-alpine
    container_name: jarvis_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - jarvis-net

  backend:
    build: .
    container_name: jarvis_backend
    restart: unless-stopped
    # El entrypoint corrige el propietario del bind mount ./data y luego baja a app.
    user: "0:0"
    depends_on:
      evolution:
        condition: service_healthy
      evolution-postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      EVOLUTION_BASE_URL: http://evolution:8080
      EVOLUTION_WEBHOOK_URL: http://backend:8000/webhook/evolution
      # Dentro del contenedor, localhost es el propio contenedor.
      # Usa host.docker.internal para alcanzar Ollama en la máquina anfitriona.
      LLM_BASE_URL: ${LLM_BASE_URL_DOCKER:-http://host.docker.internal:11434/v1}
      TZ: America/Bogota
      LOG_LEVEL: INFO
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 20s
    logging: *default-logging
    networks:
      - jarvis-net

volumes:
  evolution_instances:
  postgres_data:
  redis_data:

networks:
  jarvis-net:
    driver: bridge
